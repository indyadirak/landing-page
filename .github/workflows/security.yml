name: Security check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * 1" # mingguan, selaras dengan Dependabot
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-and-headers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (ci)
        run: npm ci

      - name: npm audit (fail on moderate+)
        run: npm audit --audit-level=moderate

      - name: Required security files exist
        run: |
          test -f SECURITY.md || (echo "SECURITY.md hilang" && exit 1)
          test -f public/_headers || (echo "public/_headers hilang" && exit 1)
          test -f public/.well-known/security.txt || (echo "security.txt hilang" && exit 1)

      - name: Check _headers contains required headers
        run: |
          for h in "Strict-Transport-Security" "X-Frame-Options" "X-Content-Type-Options" "X-XSS-Protection" "Referrer-Policy" "Permissions-Policy" "Content-Security-Policy" "Cross-Origin-Opener-Policy" "Cross-Origin-Resource-Policy"; do
            grep -q "$h" public/_headers || (echo "Header $h hilang di public/_headers" && exit 1)
          done
          echo "Semua header wajib ada."

      - name: Check CSP is hardened
        run: |
          csp=$(grep '^  Content-Security-Policy:' public/_headers || true)
          test -n "$csp" || (echo "CSP tidak ditemukan" && exit 1)
          for bad in "'unsafe-inline'" "'unsafe-eval'" "default-src 'self'"; do
            case "$csp" in
              *"$bad"*) echo "CSP mengandung nilai tidak aman: $bad" && exit 1 ;;
            esac
          done
          for required in "default-src 'none'" "frame-ancestors 'none'" "object-src 'none'" "base-uri 'none'" "form-action 'none'"; do
            case "$csp" in
              *"$required"*) ;;
              *) echo "CSP tidak mengandung: $required" && exit 1 ;;
            esac
          done
          echo "CSP hardened."

      - name: Check security.txt Expires > 30 hari
        run: |
          python3 - <<'EOF'
          import re, sys
          from datetime import datetime, timezone
          txt = open("public/.well-known/security.txt").read()
          m = re.search(r"^Expires:\s*(.+)$", txt, re.M)
          assert m, "Expires tidak ditemukan di security.txt"
          exp = datetime.fromisoformat(m.group(1).strip().replace("Z", "+00:00"))
          sisa = (exp - datetime.now(timezone.utc)).days
          print(f"Expires: {exp.isoformat()} ({sisa} hari lagi)")
          assert sisa > 30, f"security.txt kedaluwarsa dalam {sisa} hari — segera rotasi!"
          assert "Contact:" in txt, "Contact hilang"
          assert "Canonical:" in txt, "Canonical hilang"
          assert "Policy:" in txt, "Policy hilang"
          assert "Canonical: https://indyadirak.com/.well-known/security.txt" in txt, "Canonical tidak sesuai domain produksi"
          EOF

      - name: Build (pastikan tidak merusak CSP/headers)
        run: npm run build
